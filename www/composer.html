.mbar-lab{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;min-height:64px}
.mbar-n{display:flex;flex-direction:column;align-items:flex-end;font-size:11.5px;line-height:1.2;color:#D4D4CF;text-align:right;max-width:38%}
.mbar-n b{font-size:20px;color:var(--acc)}
.app{padding-bottom:96px}
}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:999px){.app{grid-template-columns:minmax(0,1fr)}.list{border-right:0;min-width:0}.panel{border-left:0}
.crop{position:static}
.thumbs{grid-auto-flow:column;grid-auto-columns:minmax(210px,72%);grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.thumbs .th{scroll-snap-align:start}
.editor{min-height:0;padding:28px 16px 40px}}
@media (max-width:699px){.editor{margin:12px;gap:20px}.list{padding:14px 12px}.list .title{font-size:26px}.cropinfo p{font-size:12px}.crop-top{padding:10px 14px}.types{padding:12px 12px 0}.panel{padding:16px 14px}}
</style>
<style>
.co-recap{display:flex;flex-direction:column;gap:4px;background:#F4F4F1;border-radius:12px;padding:12px 14px}
.co-line{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.co-line .muted{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-total{border-top:1px solid #E2E2DD;margin-top:4px;padding-top:8px;font-weight:700}
.co-total b{font-size:20px}
.co-check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.co-check input{width:20px;height:20px;margin:0;flex:none;accent-color:#2D2D31}
.co-err{font-size:13px;font-weight:700;color:#A8292C;margin-top:-6px}
.co-alert{font-size:13.5px;font-weight:700;color:#7A4A00;background:#FEF3C7;border-radius:10px;padding:10px 12px}
.noscript{max-width:560px;margin:40px auto;padding:0 16px;font-family:Archivo,system-ui,sans-serif}
</style>
<script src="/assets/vue.js?v=1" defer></script>
<script src="/assets/composer.js?v=1" defer></script>
</head>
<body>

<div id="app"><noscript><p class="noscript">Le configurateur a besoin de JavaScript. Activez-le ou appelez-nous au 05 49 74 31 07.</p></noscript></div>
<template id="tpl">
<div class="pg">

<header class="top">
<a class="brand" href="/" aria-label="Copy Color Service, accueil étiquettes"><img src="/assets/logo.png" alt="Copy Color Service"><span>étiquettes</span></a>
<nav class="steps" aria-label="Étapes"><span class="on">1 · Mon carnet</span><span class="on">2 · Personnalisation</span><span class="{{stepCheck}}">3 · Validation</span></nav>
</header>
<sc-if value="{{welcome}}" hint-placeholder-val="{{ true }}">
<div class="wel-bg">
<div class="wel" role="dialog" aria-modal="true" aria-labelledby="welTitle">
<h2 class="title-sm" id="welTitle">C'est pour qui ?</h2>
<p class="muted small" style="margin:0">On met le prénom sur toutes les planches du carnet. Vous pourrez tout changer ensuite.</p>
<div class="wel-prev"><div class="lab {{wLab.pcls}}" style="{{wLab.box}}"><svg aria-hidden="true" style="{{wLab.icon}}"><use href="#{{picto}}"></use></svg><div style="{{wLab.col}}"><span style="{{wLab.nameS}}">{{wText}}</span><sc-if value="{{wHas2}}" hint-placeholder-val="{{ true }}"><span style="{{wLab.line2}}">{{wLine2Up}}</span></sc-if></div></div></div>
<label class="in">Prénom<input type="text" data-k="wname" maxlength="14" autofocus autocomplete="off" value="{{wName}}" onChange="{{setWName}}" placeholder="Léa"></label>
<label class="in">Nom <span class="muted" style="font-weight:400">ou classe, n° de chambre… facultatif</span><input type="text" data-k="wline2" maxlength="20" autocomplete="off" value="{{wLine2}}" onChange="{{setWLine2}}" placeholder="Martin"></label>
<button type="button" class="btn btn-lime btn-big wide" style="{{wBtnStyle}}" onClick="{{submitWelcome}}">Voir mes étiquettes</button>
<button type="button" class="wel-skip" onClick="{{closeWelcome}}">Plus tard</button>
</div>
</div>
</sc-if>
<sc-if value="{{staffAsk}}">
<div class="wel-bg">
<div class="wel" role="dialog" aria-modal="true" aria-labelledby="stTitle">
<h2 class="title-sm" id="stTitle">Mode atelier</h2>
<label class="in">Code<input type="password" data-k="scode" autocomplete="off" value="{{staffInput}}" onChange="{{setStaffInput}}" onKeyDown="{{staffKey}}"></label>
<sc-if value="{{hasStaffErr}}"><span class="co-err">{{staffErr}}</span></sc-if>
<button type="button" class="btn btn-lime btn-big wide" onClick="{{staffLogin}}">Entrer</button>
<button type="button" class="wel-skip" onClick="{{closeStaff}}">Annuler</button>
</div>
</div>
</sc-if>
<sc-if value="{{checkout}}">
<div class="wel-bg">
<div class="wel" role="dialog" aria-modal="true" aria-labelledby="coTitle" style="max-width:480px;max-height:calc(100vh - 32px);overflow:auto">
<h2 class="title-sm" id="coTitle">Valider mon carnet</h2>
<div class="co-recap">
<sc-for list="{{recap}}" as="r"><div class="co-line"><span>{{r.label}}</span><span class="muted">{{r.design}}</span></div></sc-for>
<div class="co-line co-total"><span>Total, payé au retrait</span><b>{{priceTxt}}</b></div>
<span class="muted small">{{recapPack}}</span>
<sc-if value="{{staffOn}}" hint-placeholder-val="{{ false }}"><label class="in">Prix total TTC <span class="muted" style="font-weight:400">facultatif, sinon {{staffUnitTxt}}</span><input type="text" data-k="sprice" inputmode="decimal" placeholder="ex. 15" value="{{staffPrice}}" onChange="{{setStaffPrice}}"></label></sc-if>
</div>
<label class="in">Nom et prénom<input type="text" data-k="cname" autocomplete="name" maxlength="100" value="{{cName}}" onChange="{{setCName}}"></label>
<sc-if value="{{hasErrName}}"><span class="co-err">{{errName}}</span></sc-if>
<label class="in">Email <span class="muted" style="font-weight:400">pour vous prévenir quand c'est prêt</span><input type="email" data-k="cemail" autocomplete="email" inputmode="email" maxlength="200" value="{{cEmail}}" onChange="{{setCEmail}}"></label>
<sc-if value="{{hasErrEmail}}"><span class="co-err">{{errEmail}}</span></sc-if>
<label class="in">Téléphone<input type="tel" data-k="cphone" autocomplete="tel" inputmode="tel" maxlength="20" value="{{cPhone}}" onChange="{{setCPhone}}"></label>
<sc-if value="{{hasErrPhone}}"><span class="co-err">{{errPhone}}</span></sc-if>
<label class="co-check"><input type="checkbox" data-k="consent" checked="{{consentChecked}}" onChange="{{toggleConsent}}"><span>J'accepte que Copy Color Service utilise ces informations pour fabriquer ma commande et me prévenir quand elle est prête. <a href="/confidentialite.html" target="_blank">Confidentialité</a></span></label>
<sc-if value="{{hasErrConsent}}"><span class="co-err">{{errConsent}}</span></sc-if>
<sc-if value="{{hasOrderError}}"><span class="co-alert">{{orderError}}</span></sc-if>
<button type="button" class="btn btn-lime btn-big wide" onClick="{{sendOrder}}">{{sendLabel}}</button>
<span class="muted small" style="text-align:center">Retrait et paiement au magasin. Produit personnalisé : pas de droit de rétractation.</span>
<button type="button" class="wel-skip" onClick="{{closeCheckout}}">Revenir au carnet</button>
</div>
</div>
</sc-if>
<sc-if value="{{done}}">
<div class="wel-bg">
<div class="wel" role="dialog" aria-modal="true" aria-labelledby="doneTitle" style="max-width:480px">
<h2 class="title-sm" id="doneTitle">Merci, c'est commandé !</h2>
<p style="margin:0">Votre commande <b>{{doneRef}}</b> est bien reçue. Un email de confirmation part à <b>{{doneEmail}}</b>.</p>
<p style="margin:0">On vous écrit dès que votre carnet est prêt. Vous le payez au retrait : <b>{{doneTotal}}</b>.</p>
<div class="co-recap"><b>Copy Color Service</b><span>12, rue du Four, 79300 Bressuire</span><span>05 49 74 31 07</span></div>
<a class="btn btn-ink btn-big wide" href="{{doneTrack}}">Suivre ma commande</a>
<button type="button" class="wel-skip" onClick="{{newOrder}}">Composer un autre carnet</button>
</div>
</div>
</sc-if>
<main class="app">

<section class="list" aria-labelledby="carnetTitle">
<a class="linkback" href="/">‹ Accueil</a>
<h1 class="title" id="carnetTitle" onClick="{{titleTap}}">Mon carnet</h1>
<sc-if value="{{staffOn}}" hint-placeholder-val="{{ false }}"><div class="staffbar"><b>Mode atelier</b><span>composition libre, sans pack</span><button type="button" onClick="{{staffQuit}}">Quitter</button></div></sc-if>
<div class="cropinfo"><span class="ic" aria-hidden="true"><i></i></span><div><b>Un design pour tout le carnet</b><p>Votre carnet contient au moins un pack, puis les planches que vous voulez en plus. Choisissez prénom, couleurs et illustration une fois : toutes les planches suivent, et vous pouvez en personnaliser une à part.</p></div></div>
<div class="thumbs" data-scroll="thumbs"><sc-for list="{{thumbs}}" as="t" hint-placeholder-count="2">
<div class="th" style="{{t.outline}}">
<button type="button" class="pick" onClick="{{t.select}}" aria-label="Modifier cette planche">
<div class="pic">
<span class="fmt">{{t.type}}</span>
<sc-if value="{{t.perso}}" hint-placeholder-val="{{ false }}"><span class="fmt" style="top:auto;bottom:8px;background:#B1D36B">Design perso</span></sc-if>
<div class="{{t.pcls}}" style="{{t.box}}">
<sc-if value="{{t.hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{t.img}}" alt="" style="{{t.imgStyle}}"></sc-if>
<sc-if value="{{t.noImg}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" style="{{t.icon}}"><use href="#{{t.ill}}"></use></svg></sc-if>
<span style="{{t.nameStyle}}">{{t.name}}</span>
</div>
</div>
</button>
<button type="button" class="rm" onClick="{{t.remove}}" aria-label="Retirer cette planche"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div class="row"><span class="name">{{t.sub}}</span>
<div class="qty"><button type="button" onClick="{{t.minus}}" aria-label="Une planche de moins">−</button><output>{{t.qty}}</output><button type="button" onClick="{{t.plus}}" aria-label="Une planche de plus">+</button></div></div>
</div>
</sc-for></div>
<button type="button" class="add" onClick="{{addPlanche}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Ajouter une planche</span></button>
<a href="/#packs" style="font-size:14px;font-weight:700">Ou partir d'un pack tout prêt ›</a>
</section>

<section class="crop" aria-label="Aperçu">
<div class="crop-top">
<div class="crop-title"><span class="title-sm">{{cropTitle}}</span><span class="muted small">{{cropSub}}</span></div>
<span class="unit">{{perSheet}}</span>
</div>
<div class="types" role="group" aria-label="Type de cette planche">
<sc-for list="{{products}}" as="p" hint-placeholder-count="4">
<button type="button" class="{{p.cls}}" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}"><b>{{p.label}}</b><span>{{p.sub}}</span></button>
</sc-for>
</div>
<div class="editor">
<div class="zoom">
<sc-if value="{{notFoot}}" hint-placeholder-val="{{ true }}">
<div class="lab {{big.pcls}}" style="{{big.box}}">
<sc-if value="{{hasCustom}}" hint-placeholder-val="{{ false }}"><img src="{{customUrl}}" alt="Votre image" style="{{big.img}}"></sc-if>
<sc-if value="{{noCustom}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" style="{{big.icon}}"><use href="#{{picto}}"></use></svg></sc-if>
<div style="{{big.col}}"><span style="{{big.nameS}}">{{displayName}}</span>
<sc-if value="{{hasLine2}}" hint-placeholder-val="{{ true }}"><span style="{{big.line2}}">{{line2Upper}}</span></sc-if></div>
</div>
</sc-if>
<sc-if value="{{isFoot}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:20px">
<div style="{{foot.wrap}}"><div aria-hidden="true" class="{{foot.pcls}}" style="{{foot.svgL}}"></div><div style="{{foot.textL}}"><span style="{{foot.nameS}}">{{displayName}}</span><span style="{{foot.l2}}">{{line2Upper}}</span></div></div>
<div style="{{foot.wrap}}"><div aria-hidden="true" class="{{foot.pcls}}" style="{{foot.svgR}}"></div><div style="{{foot.textR}}"><span style="{{foot.nameS}}">{{displayName}}</span><span style="{{foot.l2}}">{{line2Upper}}</span></div></div>
</div>
</sc-if>
<div style="display:flex;align-items:center;gap:12px;margin-top:22px;color:#fff">
<span style="min-width:64px;height:64px;padding:0 10px;border-radius:32px;background:#B1D36B;color:#2D2D31;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800">×{{count}}</span>
<span style="display:flex;flex-direction:column;font-size:14px;line-height:1.35"><b style="font-size:16px">{{countLine}}</b><span style="color:#D4D4CF">sur votre planche 22 × 10 cm</span></span>
</div>
</div>
<span class="editor-hint">Aperçu agrandi de votre étiquette</span>
</div>
</section>

<div class="mbar" aria-hidden="true">
<div class="mbar-lab">
<sc-if value="{{notFoot}}" hint-placeholder-val="{{ true }}">
<div class="lab {{mini.pcls}}" style="{{mini.box}}">
<sc-if value="{{hasCustom}}" hint-placeholder-val="{{ false }}"><img src="{{customUrl}}" alt="" style="{{mini.img}}"></sc-if>
<sc-if value="{{noCustom}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" style="{{mini.icon}}"><use href="#{{picto}}"></use></svg></sc-if>
<div style="{{mini.col}}"><span style="{{mini.nameS}}">{{displayName}}</span>
<sc-if value="{{hasLine2}}" hint-placeholder-val="{{ true }}"><span style="{{mini.line2}}">{{line2Upper}}</span></sc-if></div>
</div>
</sc-if>
<sc-if value="{{isFoot}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:6px">
<div style="{{footMini.wrap}}"><div class="{{footMini.pcls}}" style="{{footMini.svgL}}"></div><div style="{{footMini.textL}}"><span style="{{footMini.nameS}}">{{displayName}}</span><span style="{{footMini.l2}}">{{line2Upper}}</span></div></div>
<div style="{{footMini.wrap}}"><div class="{{footMini.pcls}}" style="{{footMini.svgR}}"></div><div style="{{footMini.textR}}"><span style="{{footMini.nameS}}">{{displayName}}</span><span style="{{footMini.l2}}">{{line2Upper}}</span></div></div>
</div>
</sc-if>
</div>
<span class="mbar-n"><b>×{{count}}</b>{{countLine}}</span>
</div>

<section class="panel" aria-label="Personnalisation">
<div class="field">
<span class="label">Appliquer le design à</span>
<div class="seg" role="radiogroup" aria-label="Appliquer le design à">
<button type="button" role="radio" class="{{scopeAll}}" aria-checked="{{scopeAllChecked}}" onClick="{{setScopeAll}}">Tout le carnet</button>
<button type="button" role="radio" class="{{scopeOne}}" aria-checked="{{scopeOneChecked}}" onClick="{{setScopeOne}}">Cette planche</button>
</div>
<span class="muted" style="font-size:12.5px;line-height:1.4">{{scopeHint}}</span>
<sc-if value="{{hasOwn}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{resetOwn}}" style="align-self:flex-start;border:0;background:none;padding:0;font-size:13.5px;font-weight:700;color:#B03C92;text-decoration:underline;text-underline-offset:3px;cursor:pointer">Remettre le design commun sur cette planche</button></sc-if>
</div>



<div class="field">
<span class="label">Texte</span>
<label class="in">Prénom<input type="text" data-k="name" maxlength="14" autocomplete="off" value="{{name}}" onChange="{{setName}}"></label>
<label class="in">2e ligne <span class="muted" style="font-weight:400">nom, classe, n° de chambre… facultatif</span><input type="text" data-k="line2" maxlength="20" autocomplete="off" value="{{line2}}" onChange="{{setLine2}}"></label>
</div>

<fieldset class="field"><legend class="label" style="margin-bottom:8px">Police</legend>
<div class="formats">
<sc-for list="{{fonts}}" as="f" hint-placeholder-count="4">
<button type="button" class="{{f.cls}}" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}"><b style="{{f.style}}">{{f.sample}}</b></button>
</sc-for>
</div></fieldset>

<div class="field">
<span class="label">Style de l'étiquette</span>
<div class="seg" role="radiogroup" aria-label="Style de l'étiquette">
<button type="button" role="radio" class="{{modeUni}}" aria-checked="{{modeUniChecked}}" onClick="{{setModeUni}}">Couleur + illustration</button>
<button type="button" role="radio" class="{{modePat}}" aria-checked="{{modePatChecked}}" onClick="{{setModePat}}">Fond illustré</button>
</div>
</div>

<sc-if value="{{isUni}}" hint-placeholder-val="{{ true }}">
<fieldset class="field"><legend class="label" style="margin-bottom:8px">Couleur</legend>
<div class="swatches">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="7">
<button type="button" class="sw" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" aria-label="{{c.label}}" style="{{c.style}}"></button>
</sc-for>
</div></fieldset>
</sc-if>

<fieldset class="field"><legend class="label" style="margin-bottom:8px">Couleur des lettres</legend>
<div class="swatches" style="align-items:center">
<button type="button" class="{{textAutoCls}}" onClick="{{setTextAuto}}" aria-pressed="{{textAutoPressed}}" style="min-height:44px;padding:0 14px"><b>Auto</b></button>
<sc-for list="{{textColors}}" as="tc" hint-placeholder-count="9">
<button type="button" class="sw" onClick="{{tc.pick}}" aria-pressed="{{tc.pressed}}" aria-label="Lettres {{tc.label}}" style="{{tc.style}}"></button>
</sc-for>
<label style="{{customTextStyle}}" title="Autre couleur">
<span class="vh">Autre couleur de lettres</span>
<input type="color" data-k="tcolor" value="{{customTextValue}}" onChange="{{setTextCustom}}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0">
</label>
</div>
<span class="muted" style="font-size:12px">Auto : la couleur la plus lisible selon le fond. Le rond arc-en-ciel permet de choisir n'importe quelle autre couleur.</span>
</fieldset>

<sc-if value="{{isPat}}" hint-placeholder-val="{{ false }}">
<fieldset class="field"><legend class="label" style="margin-bottom:8px">Fond illustré</legend>
<div class="pats">
<sc-for list="{{patterns}}" as="pt" hint-placeholder-count="5">
<button type="button" class="{{pt.cls}}" onClick="{{pt.pick}}" aria-pressed="{{pt.pressed}}"><span class="{{pt.swcls}}" style="{{pt.swatch}}" aria-hidden="true"></span><span>{{pt.label}}</span></button>
</sc-for>
</div>
<span class="muted" style="font-size:12px">Sur un fond illustré, le prénom est entouré d'un liseré blanc pour rester lisible (sauf texte blanc).</span>
</fieldset>
</sc-if>

<sc-if value="{{isUni}}" hint-placeholder-val="{{ true }}">
<fieldset class="field"><legend class="label" style="margin-bottom:8px">Illustration</legend>
<div class="illus">
<sc-for list="{{pictos}}" as="ic" hint-placeholder-count="8">
<button type="button" class="{{ic.cls}}" onClick="{{ic.pick}}" aria-pressed="{{ic.pressed}}" aria-label="{{ic.label}}"><sc-if value="{{ic.hasSvg}}" hint-placeholder-val="{{ true }}"><svg width="40" height="40" aria-hidden="true"><use href="#{{ic.id}}"></use></svg></sc-if><span style="font-size:13px;font-weight:700">{{ic.txt}}</span></button>
</sc-for>
</div>
<div class="seg" role="radiogroup" aria-label="Couleurs de l'illustration">
<button type="button" role="radio" class="{{segAuto}}" aria-checked="{{autoChecked}}" onClick="{{setAuto}}">Aux couleurs de l'étiquette</button>
<button type="button" role="radio" class="{{segOrig}}" aria-checked="{{origChecked}}" onClick="{{setOrig}}">D'origine</button>
</div>
<label class="add" for="mon-image" style="background:{{importBg}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></svg><span>{{importTitle}}</span></label>
<input id="mon-image" class="vh" type="file" accept="image/png,image/jpeg" onChange="{{onImport}}">
<sc-if value="{{hasUploadError}}"><span style="font-size:13px;font-weight:700;color:#A8292C">{{uploadError}}</span></sc-if>
<sc-if value="{{hasCustom}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{clearCustom}}" style="align-self:flex-start;border:0;background:none;padding:0;font-size:14px;font-weight:700;color:#B03C92;text-decoration:underline;text-underline-offset:3px;cursor:pointer">Retirer mon image</button></sc-if>
<span class="muted" style="font-size:12px">Logo du club, dessin de l'enfant… En important une image, vous certifiez en détenir les droits.</span>
</fieldset>
</sc-if>

<div class="cart">
<span class="label">{{cartLine}}</span>
<div class="sum-total"><span>Total</span><b>{{priceTxt}}</b></div>
<sc-if value="{{priceNoteOn}}" hint-placeholder-val="{{ true }}"><span class="muted small">{{priceNote}}</span></sc-if>
<sc-if value="{{minKo}}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:700;color:#7A4A00;background:#FEF3C7;border-radius:10px;padding:8px 10px">{{minMsg}}</span></sc-if>
<button type="button" class="btn btn-lime btn-big wide" aria-disabled="{{minKo}}" style="{{validateStyle}}" onClick="{{openCheckout}}">Valider mon carnet</button>
<span class="muted small">Retrait au magasin · payé au retrait · produit personnalisé, pas de rétractation</span>
</div>
</section>
</main>
<footer class="foot"><span>Copy Color Service · 12, rue du Four, 79300 Bressuire · 05 49 74 31 07</span><a href="/confidentialite.html">Confidentialité</a></footer>
</div>
</template>
<script src="/assets/live.js?v=1" defer></script>
</body>
</html>
